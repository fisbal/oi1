<!doctype html>
<html lang="fr" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>Office In 1 — Démo</title>
<link rel="icon" href="../icons/icon.svg">
<!-- The Office In 1 demo, 9:16 (TikTok, Reels, Stories, WhatsApp Status) or 1:1 (?format=square).
     Its apps, screenshots and version come from info.json, made again from the real app at every build,
     so the demo always shows the current Office In 1. scripts/promo.mjs films it into MP4.
     ?lang=fr|en  ?rec=1 (no controls, plays once)  ?scene=end (last picture at once, for posters) -->
<style>
@font-face { font-family: 'Playfair Display Variable'; src: url(fonts/playfair-display-latin-wght-normal.woff2) format('woff2'); font-weight: 400 900; font-display: block; }
@font-face { font-family: 'DM Sans Variable'; src: url(fonts/dm-sans-latin-wght-normal.woff2) format('woff2'); font-weight: 100 1000; font-display: block; }
:root {
  --ink: #07070A; --gold: #D4A843; --gold-hi: #F2D78B; --gold-lo: #B8892E; --text: #F4EFE6; --dim: #B9B1A3;
  --display: 'Playfair Display Variable', 'Playfair Display', Georgia, serif;
  --sans: 'DM Sans Variable', 'DM Sans', system-ui, sans-serif;
  --goldfill: linear-gradient(135deg, var(--gold-lo), var(--gold-hi) 55%, var(--gold));
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; background: #000; overflow: hidden; }
body { display: grid; place-items: center; font-family: var(--sans); color: var(--text); }

/* The film is drawn at 1080x1920 (or 1080x1080) and scaled to the window. */
#film { position: absolute; left: 50%; top: 50%; width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); transform-origin: center; flex: none; }
.square #film { height: 1080px; }

/* Living background: the suite's gold nebula. */
.nebula { position: absolute; inset: -20%; background:
  radial-gradient(40% 30% at 30% 25%, rgba(212,168,67,.22), transparent 70%),
  radial-gradient(35% 28% at 75% 70%, rgba(212,168,67,.14), transparent 70%),
  radial-gradient(60% 40% at 50% 110%, rgba(184,137,46,.18), transparent 70%);
  animation: drift 18s ease-in-out infinite alternate; }
.tint { position: absolute; inset: 0; background: radial-gradient(60% 45% at 50% 45%, var(--accent, transparent), transparent 75%); opacity: .22; transition: background 1s, opacity 1s; }
@keyframes drift { to { transform: translate(4%, -3%) rotate(6deg) scale(1.08); } }
.grain { position: absolute; inset: 0; opacity: .05; background-image: radial-gradient(#fff 1px, transparent 1px); background-size: 6px 6px; }

/* Safe zone for TikTok / Reels / Stories: top 220, bottom 360, left 80, right 150 (buttons and captions). */
.scene { position: absolute; inset: 220px 150px 360px 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; opacity: 0; pointer-events: none; transition: opacity .6s ease; }
.square .scene { inset: 70px 90px 70px 90px; }
/* A still poster (?scene=end) has no buttons over it: centered both ways. */
.poster:not(.square) .scene { inset: 240px 115px 240px 115px; }
.scene.on { opacity: 1; }

h1, h2 { font-family: var(--display); font-weight: 700; letter-spacing: -.01em; line-height: 1.02; }
b { font-weight: inherit; background: var(--goldfill); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* Rise in: every [data-in] child comes up one after the other when its scene is on. */
[data-in] { opacity: 0; transform: translateY(40px) scale(.98); transition: opacity .7s cubic-bezier(.2,.7,.2,1), transform .9s cubic-bezier(.2,.7,.2,1); transition-delay: calc(var(--d, 0) * 1s); }
.on [data-in] { opacity: 1; transform: none; }

/* 1. Intro */
.crest { width: 360px; height: 360px; filter: drop-shadow(0 0 60px rgba(212,168,67,.45)); }
.on .crest { animation: crest 3.6s ease-out both; }
@keyframes crest { from { transform: scale(.6) rotate(-8deg); filter: drop-shadow(0 0 0 rgba(212,168,67,0)); } 60% { transform: scale(1.04); } to { transform: scale(1); } }
.brand { font-size: 150px; margin-top: 50px; }
.tagline { font-size: 50px; color: var(--dim); margin-top: 34px; max-width: 900px; line-height: 1.25; }
.square .crest { width: 250px; height: 250px; } .square .brand { font-size: 120px; margin-top: 28px; }

/* 2. Many apps, one place */
.orbit { position: relative; width: 760px; height: 760px; }
.chip { position: absolute; left: 50%; top: 50%; width: 150px; height: 150px; margin: -75px; border-radius: 40px; display: grid; place-items: center;
  font: 800 64px var(--sans); color: #0b0b0e; background: var(--c); box-shadow: 0 20px 60px -10px var(--c), inset 0 2px 0 rgba(255,255,255,.4);
  transform: translate(var(--x), var(--y)) scale(1); transition: transform 1.1s cubic-bezier(.6,0,.3,1), opacity .8s; transition-delay: calc(var(--d) * 1s); }
.chip.later { background: transparent; color: var(--c); border: 5px dashed var(--c); box-shadow: none; opacity: .75; }
.merge .chip { transform: translate(0, 0) scale(.2); opacity: 0; }
.soonline { font-size: 38px; color: var(--gold-hi); margin-top: 18px; }
.one { position: absolute; inset: 0; display: grid; place-items: center; font: 700 520px/1 var(--display); opacity: 0; transform: scale(.4); transition: all .9s cubic-bezier(.2,.8,.2,1.2) .9s; }
.merge .one { opacity: 1; transform: none; }
.count { font-size: 104px; margin-top: 40px; }
.sub { font-size: 44px; color: var(--dim); margin-top: 26px; line-height: 1.3; max-width: 780px; }

/* 3. One app */
.app { width: 100%; height: 100%; display: grid; grid-template-rows: auto 1fr auto; justify-items: center; gap: 30px; }
.app h2 { font-size: 104px; color: var(--c); text-shadow: 0 0 60px color-mix(in srgb, var(--c) 45%, transparent); }
.app .kind { font-size: 44px; color: var(--dim); margin-top: 10px; }
.phone { position: relative; height: 100%; max-height: 900px; aspect-ratio: 390 / 844; border-radius: 64px; padding: 16px; background: linear-gradient(160deg, #2a2620, #0c0b09 40%, #1d1a15);
  box-shadow: 0 0 0 3px rgba(242,215,139,.35), 0 60px 120px -30px rgba(0,0,0,.9), 0 0 120px -30px var(--c); transform: perspective(1800px) rotateY(-14deg) rotateX(4deg); }
.on .phone { animation: phone 2.8s cubic-bezier(.2,.7,.2,1) both; }
@keyframes phone { from { transform: perspective(1800px) rotateY(-30deg) rotateX(10deg) translateY(120px) scale(.9); opacity: 0; } 30% { opacity: 1; } to { transform: perspective(1800px) rotateY(-10deg) rotateX(3deg); } }
.phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: 50px; display: block; background: #111; }
.phone::after { content: ''; position: absolute; inset: 16px; border-radius: 50px; background: linear-gradient(115deg, rgba(255,255,255,.14), transparent 35%); pointer-events: none; }
.feats { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; max-width: 860px; }
.feat { font-size: 36px; font-weight: 600; padding: 14px 28px; border-radius: 999px; background: rgba(255,255,255,.06); border: 2px solid color-mix(in srgb, var(--c) 60%, transparent); }
.square .app { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; align-items: center; text-align: left; justify-items: start; }
.square .app .phone { max-height: 860px; grid-row: 1; grid-column: 2; justify-self: center; }
.square .app h2 { font-size: 86px; } .square .feats { justify-content: flex-start; margin-top: 30px; }

/* 4. Linked */
.links { position: relative; width: 820px; height: 620px; }
.node { position: absolute; width: 220px; height: 220px; border-radius: 56px; display: grid; place-items: center; font: 800 90px var(--sans); color: #0b0b0e; background: var(--c); box-shadow: 0 30px 80px -20px var(--c); }
.links svg { position: absolute; inset: 0; overflow: visible; }
.links path { fill: none; stroke: url(#linkgrad); stroke-width: 10; stroke-linecap: round; stroke-dasharray: 900; stroke-dashoffset: 900; }
.on .links path { animation: draw 1.4s ease-in-out forwards; animation-delay: calc(var(--d) * 1s); }
@keyframes draw { to { stroke-dashoffset: 0; } }
.pulse { position: absolute; left: 50%; top: 50%; width: 180px; height: 180px; margin: -90px; border-radius: 50%; border: 6px solid var(--gold); opacity: 0; }
.on .pulse { animation: pulse 1.6s ease-out 1.2s infinite; }
@keyframes pulse { from { transform: scale(.4); opacity: .9; } to { transform: scale(2.4); opacity: 0; } }

/* 5. Everywhere */
.plats { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; width: 820px; margin-top: 60px; }
.plat { display: flex; align-items: center; gap: 22px; padding: 30px 34px; border-radius: 36px; background: rgba(255,255,255,.05); border: 2px solid rgba(242,215,139,.3); font-size: 46px; font-weight: 700; }
.plat svg { width: 64px; height: 64px; fill: var(--gold-hi); flex: none; }
.perks { margin-top: 50px; display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; max-width: 860px; }
.perk { font-size: 36px; padding: 14px 26px; border-radius: 999px; background: rgba(212,168,67,.12); color: var(--gold-hi); }
.perk::before { content: '✓  '; font-weight: 800; }

/* 6. End card */
.qr { width: 520px; height: 520px; padding: 30px; border-radius: 48px; background: #fff; box-shadow: 0 0 0 6px rgba(242,215,139,.6), 0 0 140px rgba(212,168,67,.45); position: relative; }
.qr img { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
.qr .mark { position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px; border-radius: 28px; box-shadow: 0 0 0 10px #fff; }
.endtitle { font-size: 96px; margin-top: 44px; }
.scan { font-size: 54px; font-weight: 700; margin-top: 20px; }
.storebtn { margin-top: 40px; display: inline-flex; align-items: center; gap: 26px; padding: 22px 44px 22px 34px; border-radius: 30px; background: #000; border: 3px solid rgba(255,255,255,.75); text-align: left; }
.storebtn svg { width: 74px; height: 74px; flex: none; }
.storebtn small { display: block; font-size: 28px; color: #ddd; }
.storebtn strong { display: block; font-size: 50px; font-weight: 700; color: #fff; letter-spacing: -.01em; }
.url { margin-top: 34px; font-size: 38px; color: var(--dim); }
.url span { color: var(--gold-hi); font-weight: 700; }
.ver { position: absolute; bottom: -120px; font-size: 26px; color: rgba(255,255,255,.35); letter-spacing: .08em; }
/* The end card (and the posters made from it) is one centered column in every format. */
.end { display: flex; flex-direction: column; align-items: center; text-align: center; width: 100%; }
.endtext { display: flex; flex-direction: column; align-items: center; }
.ver { left: 0; right: 0; text-align: center; }
.square .qr { width: 400px; height: 400px; padding: 24px; border-radius: 40px; }
.square .qr .mark { width: 96px; height: 96px; margin: -48px; border-radius: 22px; }
.square .endtitle { font-size: 80px; margin-top: 26px; }
.square .scan { font-size: 46px; margin-top: 10px; }
.square .storebtn { margin-top: 24px; padding: 16px 34px 16px 26px; }
.square .storebtn svg { width: 56px; height: 56px; } .square .storebtn small { font-size: 22px; } .square .storebtn strong { font-size: 40px; }
.square .url { margin-top: 20px; font-size: 32px; }
.square .ver { bottom: -40px; font-size: 22px; }

/* Controls (not in recordings) */
.ctl { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 8px; z-index: 5; font: 600 14px var(--sans); }
.ctl button, .ctl a { all: unset; cursor: pointer; padding: 9px 16px; border-radius: 999px; background: rgba(20,18,14,.8); color: var(--gold-hi); border: 1px solid rgba(242,215,139,.35); backdrop-filter: blur(8px); }
.ctl button:focus-visible, .ctl a:focus-visible { outline: 2px solid var(--gold-hi); }
.bar { position: fixed; left: 0; top: 0; height: 3px; background: var(--goldfill); width: 0; z-index: 5; }
.rec .ctl, .rec .bar { display: none; }
@media (prefers-reduced-motion: reduce) { .nebula, .on .pulse { animation: none; } }
</style>
</head>
<body>
<div id="film">
  <div class="nebula"></div><div class="tint"></div><div class="grain"></div>
  <div id="scenes"></div>
</div>
<div class="bar" id="bar"></div>
<div class="ctl"><button id="pp" type="button"></button><button id="lg" type="button"></button><a id="kitlink" href="./">Kit</a></div>
<script src="kit.js"></script>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const rec = q.get('rec') === '1', square = q.get('format') === 'square';
  const L = OI1Kit.lang(), t = OI1Kit.T[L];
  document.documentElement.lang = L;
  document.body.classList.toggle('rec', rec);
  document.body.classList.toggle('square', square);
  document.body.classList.toggle('poster', q.get('scene') === 'end');
  const data = await OI1Kit.load();
  const film = document.getElementById('film'), box = document.getElementById('scenes');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  const every = data.apps[L] || data.apps.fr || [];
  const apps = every.filter(a => a.ready), soon = every.filter(a => !a.ready);
  const shots = data.shots[L] || data.shots.fr || {};
  const filmed = apps.filter(a => shots[a.short.replace('+', 'plus').toLowerCase()]);
  const badge = a => a.short === 'Code+' ? 'C+' : a.short === 'ProDFos' ? 'P' : a.short[0];

  const scenes = [];
  const add = (dur, html, accent) => scenes.push({ dur, html, accent });

  add(3.6, `<img class="crest" src="../icons/icon.svg" alt="">
    <h1 class="brand" data-in style="--d:.5">Office In <b>1</b></h1>
    <p class="tagline" data-in style="--d:1.1">${t.tagline}</p>`);

  // Every app of the suite, as on its home screen; those still coming are shown dimmed.
  const ring = every.map((a, i) => {
    const ang = (i / every.length) * Math.PI * 2 - Math.PI / 2, r = 300;
    return `<div class="chip${a.ready ? '' : ' later'}" style="--c:${a.color};--x:${Math.round(Math.cos(ang) * r)}px;--y:${Math.round(Math.sin(ang) * r)}px;--d:${(i * 0.06).toFixed(2)}">${esc(badge(a))}</div>`;
  }).join('');
  add(4.6, `<div class="orbit">${ring}<div class="one"><b>1</b></div></div>
    <h2 class="count" data-in style="--d:.3">${t.count(every.length)}</h2>
    ${soon.length ? `<p class="soonline" data-in style="--d:.6">${esc(t.soonLine(apps.length, soon.length > 1 ? soon.slice(0, -1).map(a => a.short).join(', ') + (L === 'fr' ? ' et ' : ' and ') + soon[soon.length - 1].short : soon[0].short))}</p>` : ''}
    <p class="sub" data-in style="--d:.9">${t.countSub}</p>`, 'rgba(212,168,67,.5)');

  for (const a of filmed) {
    const feats = (OI1Kit.FEATURES[a.short] || {})[L] || [a.kind];
    add(2.8, `<div class="app" style="--c:${a.color}">
      <div><h2 data-in>${esc(a.name)}</h2><p class="kind" data-in style="--d:.15">${esc(a.kind)}</p>
        ${square ? `<div class="feats">${feats.map((f, i) => `<span class="feat" data-in style="--d:${.4 + i * .18}">${esc(f)}</span>`).join('')}</div>` : ''}</div>
      <div class="phone"><img src="${esc(shots[a.short.replace('+', 'plus').toLowerCase()])}" alt=""></div>
      ${square ? '' : `<div class="feats">${feats.map((f, i) => `<span class="feat" data-in style="--d:${.5 + i * .18}">${esc(f)}</span>`).join('')}</div>`}
    </div>`, a.color);
  }

  const by = n => apps.find(a => a.short === n);
  const trio = [by('Class'), by('Letter'), by('Stage')].filter(Boolean);
  if (trio.length === 3) {
    add(3.4, `<h2 class="count" data-in>${t.linkedTitle}</h2>
      <div class="links" data-in style="--d:.2">
        <svg viewBox="0 0 820 620"><defs><linearGradient id="linkgrad"><stop offset="0" stop-color="${trio[0].color}"/><stop offset=".5" stop-color="#F2D78B"/><stop offset="1" stop-color="${trio[1].color}"/></linearGradient></defs>
          <path style="--d:.5" d="M220 140 C 410 60, 410 60, 600 140"/><path style="--d:.9" d="M140 250 C 200 420, 260 470, 330 480"/><path style="--d:1.2" d="M680 250 C 620 420, 560 470, 490 480"/></svg>
        <div class="node" style="--c:${trio[0].color};left:0;top:30px">${esc(badge(trio[0]))}</div>
        <div class="node" style="--c:${trio[1].color};right:0;top:30px">${esc(badge(trio[1]))}</div>
        <div class="node" style="--c:${trio[2].color};left:300px;top:390px">${esc(badge(trio[2]))}</div>
        <div class="pulse"></div>
      </div>
      <p class="sub" data-in style="--d:1">${t.linkedSub}</p>`, 'rgba(242,215,139,.4)');
  }

  const icon = {
    win: '<svg viewBox="0 0 24 24"><path d="M3 5.5 10.5 4.4v7.1H3zm8.5-1.2L21 3v8.5h-9.5zM3 12.5h7.5v7.1L3 18.5zm8.5 0H21V21l-9.5-1.4z"/></svg>',
    and: '<svg viewBox="0 0 24 24"><path d="M6 10h12v7.5a1.5 1.5 0 0 1-1.5 1.5H15v2.2a1.3 1.3 0 0 1-2.6 0V19h-.8v2.2a1.3 1.3 0 0 1-2.6 0V19H7.5A1.5 1.5 0 0 1 6 17.5zM3.7 10a1.3 1.3 0 0 1 1.3 1.3v4.4a1.3 1.3 0 0 1-2.6 0v-4.4A1.3 1.3 0 0 1 3.7 10zm16.6 0a1.3 1.3 0 0 1 1.3 1.3v4.4a1.3 1.3 0 0 1-2.6 0v-4.4a1.3 1.3 0 0 1 1.3-1.3zM6 9a6 6 0 0 1 3.1-4.7l-1-1.8.5-.3 1 1.8a6.4 6.4 0 0 1 4.8 0l1-1.8.5.3-1 1.8A6 6 0 0 1 18 9zm3.5-2.4a.7.7 0 1 0 0 1.4.7.7 0 0 0 0-1.4zm5 0a.7.7 0 1 0 0 1.4.7.7 0 0 0 0-1.4z"/></svg>',
    mac: '<svg viewBox="0 0 24 24"><path d="M16.4 12.6c0-2.5 2-3.7 2.1-3.8a4.6 4.6 0 0 0-3.6-2c-1.5-.2-3 .9-3.7.9-.8 0-2-.9-3.2-.9a4.8 4.8 0 0 0-4 2.5c-1.7 3-.4 7.3 1.2 9.7.8 1.2 1.8 2.5 3 2.4 1.2 0 1.7-.8 3.1-.8 1.5 0 1.9.8 3.2.8 1.3 0 2.1-1.2 2.9-2.4a10 10 0 0 0 1.3-2.7 4.2 4.2 0 0 1-2.3-3.7zM14 5.2A4.2 4.2 0 0 0 15 2a4.3 4.3 0 0 0-2.8 1.4 4 4 0 0 0-1 3 3.5 3.5 0 0 0 2.8-1.2z"/></svg>',
    web: '<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm6.9 6h-3a15.6 15.6 0 0 0-1.4-3.6A8 8 0 0 1 18.9 8zM12 4a14 14 0 0 1 1.9 4h-3.8A14 14 0 0 1 12 4zM4.3 14a8.2 8.2 0 0 1 0-4h3.4a16.5 16.5 0 0 0 0 4zm.8 2h3a15.6 15.6 0 0 0 1.4 3.6A8 8 0 0 1 5.1 16zm3-8h-3a8 8 0 0 1 4.4-3.6A15.6 15.6 0 0 0 8.1 8zM12 20a14 14 0 0 1-1.9-4h3.8A14 14 0 0 1 12 20zm2.3-6H9.7a14.7 14.7 0 0 1 0-4h4.6a14.7 14.7 0 0 1 0 4zm.2 5.6a15.6 15.6 0 0 0 1.4-3.6h3a8 8 0 0 1-4.4 3.6zm1.8-5.6a16.5 16.5 0 0 0 0-4h3.4a8.2 8.2 0 0 1 0 4z"/></svg>',
  };
  add(3.6, `<h2 class="count" data-in>${t.everywhereTitle}</h2>
    <div class="plats">
      <div class="plat" data-in style="--d:.3">${icon.win}Windows</div><div class="plat" data-in style="--d:.45">${icon.and}Android</div>
      <div class="plat" data-in style="--d:.6">${icon.mac}Mac</div><div class="plat" data-in style="--d:.75">${icon.web}Web</div>
    </div>
    <div class="perks">${t.perks.map((p, i) => `<span class="perk" data-in style="--d:${1 + i * .15}">${p}</span>`).join('')}</div>`);

  // A plain download mark (not Microsoft's logo: their badge artwork is theirs).
  const storeLogo = '<svg viewBox="0 0 48 48" fill="none" stroke="#F2D78B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 15h28l-2.5 25h-23z"/><path d="M18 15v-2a6 6 0 0 1 12 0v2"/><path d="M24 22v11m-5-5 5 5 5-5"/></svg>';
  add(6, `<div class="end">
      <div class="qr" data-in><img src="qr.svg" alt=""><img class="mark" src="../icons/icon.svg" alt=""></div>
      <div class="endtext">
        <h2 class="endtitle" data-in style="--d:.15">Office In <b>1</b></h2>
        <p class="scan" data-in style="--d:.3">${t.scan}</p>
        <div class="storebtn" data-in style="--d:.6">${storeLogo}<div><small>${t.store}</small><strong>${t.storeName}</strong></div></div>
        <p class="url" data-in style="--d:.9">${t.orVisit} <span>${esc(OI1Kit.host(data.links.site))}</span></p>
      </div>
      ${data.version ? `<p class="ver">OFFICE IN 1 · v${esc(data.version)}</p>` : ''}
    </div>`);

  box.innerHTML = scenes.map((s, i) => `<section class="scene" data-i="${i}">${s.html}</section>`).join('');
  const els = [...box.children];
  const total = scenes.reduce((n, s) => n + s.dur, 0);
  window.promoLength = Math.round(total * 10) / 10;

  // Fit the film to the window (scale 1 when the window is the film's size, as when it is recorded).
  const fit = () => { const w = 1080, h = square ? 1080 : 1920; film.style.transform = `translate(-50%, -50%) scale(${Math.min(innerWidth / w, innerHeight / h)})`; };
  addEventListener('resize', fit); fit();

  // Wait for fonts and pictures so the first frame of the film is already the finished look.
  await document.fonts.ready.catch(() => {});
  await Promise.all([...document.images].map(img => img.decode().catch(() => {})));

  const tint = film.querySelector('.tint');
  let cur = -1, playing = true, t0 = performance.now(), pausedAt = 0;
  const show = i => {
    if (i === cur) return;
    cur = i;
    els.forEach((el, k) => el.classList.toggle('on', k === i));
    const merge = els[i].querySelector('.orbit');
    if (merge) setTimeout(() => merge.classList.add('merge'), 1200);
    els.forEach((el, k) => { if (k !== i) el.querySelector('.orbit')?.classList.remove('merge'); });
    tint.style.background = scenes[i].accent ? `radial-gradient(60% 45% at 50% 45%, ${scenes[i].accent}, transparent 75%)` : 'none';
  };

  if (q.get('scene') === 'end') { show(els.length - 1); window.promoReady = true; return; }

  const bar = document.getElementById('bar');
  const tick = now => {
    let at = playing ? (now - t0) / 1000 : pausedAt;
    if (at >= total) {
      if (rec) { window.promoDone = true; return; }
      t0 = now; at = 0; cur = -1;
    }
    let acc = 0, i = 0;
    for (; i < scenes.length; i++) { acc += scenes[i].dur; if (at < acc) break; }
    show(Math.min(i, scenes.length - 1));
    bar.style.width = `${(at / total) * 100}%`;
    requestAnimationFrame(tick);
  };
  window.promoReady = true;
  requestAnimationFrame(now => { t0 = now; tick(now); });

  // Controls: pause/play (also a tap on the film or Space), language, back to the kit.
  const pp = document.getElementById('pp'), lgb = document.getElementById('lg');
  const label = () => { pp.textContent = playing ? '❚❚ ' + t.pause : '▶ ' + t.play; };
  const toggle = () => {
    if (playing) { pausedAt = (performance.now() - t0) / 1000; document.body.style.setProperty('--paused', 1); film.querySelectorAll('*').forEach(e => e.style.animationPlayState = 'paused'); }
    else { t0 = performance.now() - pausedAt * 1000; film.querySelectorAll('*').forEach(e => e.style.animationPlayState = ''); }
    playing = !playing; label();
  };
  pp.onclick = toggle; film.onclick = toggle;
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); toggle(); } });
  label();
  lgb.textContent = L === 'fr' ? 'English' : 'Français';
  lgb.onclick = () => { q.set('lang', L === 'fr' ? 'en' : 'fr'); location.search = q.toString(); };
})();
</script>
