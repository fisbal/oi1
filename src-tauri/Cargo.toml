[package]
name = "oi1"
version = "0.1.0"
description = "Office In 1: the desktop and Android app around the web suite"
authors = ["Martin Balla"]
license = ""
repository = "https://github.com/fisbal/oi1"
edition = "2021"
rust-version = "1.77"

[lib]
name = "oi1_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
# In 1 Mail: IMAP and SMTP over TLS for Gmail, Yahoo, iCloud and others with an app password (a web page cannot).
# rustls + ring + Mozilla roots: no OpenSSL, same behaviour on Windows, Mac and Android.
imap = { version = "3.0.0-alpha.15", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "rustls", "ring", "webpki-roots", "builder"] }
base64 = "0.22"

# Updating itself is for the desktop app; Android gets new versions as APKs (see src/shell/update.ts).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
