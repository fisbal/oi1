[package]
name = "oi1"
version = "0.1.0"
description = "Office In 1: the desktop and Android app around the web suite"
authors = ["Martin Balla"]
license = ""
repository = "https://github.com/fisbal/oi1"
edition = "2021"
rust-version = "1.77"

[lib]
name = "oi1_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

# Updating itself is for the desktop app; Android gets new versions as APKs (see src/shell/update.ts).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
