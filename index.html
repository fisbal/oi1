<!doctype html>
<html lang="en" translate="no" class="notranslate">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Office In 1</title>
  <!-- Office In 1 has its own languages (and translates documents itself, keeping the original: rule 13). The
       browser's page translator must not run: it turned "Office In 1" into "Bureau en 1" and "Office Letter" into
       "Lettre de bureau" (Martin, 2026-11-01, Microsoft Store app on Windows in French). Brand names never change. -->
  <meta name="google" content="notranslate">
  <!-- Security (OWASP CSP Cheat Sheet): no plug-ins (<object>/<embed>), no <base> tag, and at build only Office In 1's
       own scripts (script-src, added by vite.config.ts strictCsp with this file's inline script hash). Code+ runs
       people's code on its own sandbox page (public/preview.html). HTML from files or AI answers is also cleaned
       by src/shell/safeHtml.ts. -->
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#2E2E36">
  <script>
    try {
      var m = localStorage.getItem('oi1.theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.dataset.theme = m;
      if (m === 'light') document.querySelector('meta[name="theme-color"]').content = '#F3EFE6';
    } catch (e) { document.documentElement.dataset.theme = 'dark'; }
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
