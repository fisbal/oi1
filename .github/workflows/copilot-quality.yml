# Runs the copilot quality comparison (scripts/copilot-quality.mjs) only when this branch is pushed: not part of
# every PR (it downloads several models). The report is in the run's summary.
name: Copilot quality
on:
  push:
    branches: [copilot-quality]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Model file sizes
        run: |
          for f in model_q4.onnx model_q4f16.onnx model_quantized.onnx model_fp16.onnx; do
            for m in Qwen2.5-0.5B-Instruct Qwen2.5-1.5B-Instruct; do
              s=$(curl -sIL "https://huggingface.co/onnx-community/$m/resolve/main/onnx/$f" | grep -i '^content-length' | tail -1 | tr -d '\r' | awk '{print $2}')
              echo "$m $f $((s/1048576)) MB"
            done
          done
      - if: false
        run: npm i --no-save --ignore-scripts=false @huggingface/transformers@3.8.1
      - if: false
        run: node scripts/copilot-quality.mjs
