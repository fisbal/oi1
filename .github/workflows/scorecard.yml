# OpenSSF Scorecard: an outside score (0 to 10) of how well the project protects itself
# (branch protection, reviews, pinned tools, dangerous workflows, signed releases…). Results in the Security tab.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    # Code scanning on a private repo needs the paid GitHub Code Security: run only while the repo is public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.5.0 (image on ghcr.io: v2.4.0's gcr.io image stopped downloading)
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
