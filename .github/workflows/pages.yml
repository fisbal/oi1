name: Build and publish OI1

# Every pull request is type-checked, tested and built.
# Every push to main is also published to GitHub Pages (gh-pages branch).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish to gh-pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git -c user.name=ci -c user.email=ci@local add -A
          git -c user.name=ci -c user.email=ci@local commit -qm "OI1 ${{ github.sha }}"
          git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} HEAD:gh-pages
